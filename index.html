<!doctype html>
<html lang="en" data-theme="c">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Brand palette bootstrap: applies ?theme=a|b|c or the saved choice before paint -->
    <script>
      (function () {
        try {
          var q = (new URLSearchParams(location.search).get('theme') || '').toLowerCase();
          var valid = q === 'a' || q === 'b' || q === 'c';
          var stored = localStorage.getItem('apptek-theme');
          var theme = valid ? q : stored === 'a' || stored === 'b' ? stored : 'c';
          document.documentElement.setAttribute('data-theme', theme);
          if (valid) localStorage.setItem('apptek-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'c');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>APPTEK — Get your busywork handled. Stay in control.</title>
    <meta
      name="description"
      content="Digital helpers draft your week’s busywork — replies, follow-ups, scheduling, reminders, invoice nudges — and every send waits for your OK. More say over what matters, less time on the grind."
    />
    <meta name="theme-color" content="#14231C" />
    <link rel="canonical" href="https://apptek.io/" />
